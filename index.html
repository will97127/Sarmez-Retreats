<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarmèz Retreats | Conciergerie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo-container">
        <span class="logo-top">Sarmèz</span>
        <span class="logo-bottom">Retreats</span>
    </div>
    <nav>
        <a href="#home">Accueil</a>
        <a href="#bungalows">Bungalow</a>
        <a href="#planning">Tarif & Réservation</a>
    </nav>
</header>

<section id="bungalows" class="container">
    <h2 class="section-title">Nos Bungalows</h2>
    <div class="grid">
        </div>
</section>
    
<section id="planning" class="container">
    <h2 class="section-title">Réservation & Packs</h2>
    <form id="booking-form" onsubmit="event.preventDefault(); sendServicesRequest();">
        <select id="bungalow" required class="large-select">
            <option value="">Choisir un bungalow</option>
            <option value="SR Plage">SR Plage - 200€ / nuit</option>
            <option value="SR Rivière">SR Rivière - 200€ / nuit</option>
            <option value="SR Tradition">SR Tradition - 200€ / nuit</option>
        </select>
        <input type="date" id="date-in" required class="large-select">
        <input type="date" id="date-out" required class="large-select">
        <select id="pack-select" class="large-select">
            <option value="0">Choisir un pack (Optionnel)</option>
            <option value="150">🌿 Pack Romantique - 150€</option>
        </select>
        <input type="text" id="client-lastname" placeholder="Nom" required class="large-select">
        <input type="text" id="client-firstname" placeholder="Prénom" required class="large-select">
        <input type="email" id="email" placeholder="Votre email" required class="large-select">
        <input type="tel" id="phone" placeholder="Votre numéro de téléphone" required class="large-select">
        <button type="submit">Envoyer la demande</button>
    </form>
</section>

<div class="chat-widget" id="chat-widget">
    <div class="chat-header" onclick="toggleChat()">
        <span>🤖 Conciergerie Sarmèz</span>
        <i class="fa-solid fa-chevron-up" id="chat-icon"></i>
    </div>
    <div class="chat-body" id="chat-body">
        <div id="chat-content">
            </div>
    </div>
</div>

<div id="price-bar" class="price-bar">
    <div class="container">
        <span>Séjour : <strong id="night-total">0</strong>€</span>
        <span>+ Pack : <strong id="pack-total">0</strong>€</span>
        <span>+ Services : <strong id="services-total-display">0</strong>€</span>
        <div class="total-final">
            Total : <span id="display-total-final">0€</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script> (function(){ emailjs.init("7RJbubWGmgBgT2N5Y"); })(); </script>
<script src="script.js"></script>
</body>
</html>
