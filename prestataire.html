<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Prestataire | Sarmèz Retreats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .demande { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .demande p { margin: 8px 0; line-height: 1.6; color: #555; }
        .demande strong { color: #333; }
        .details { background: #f9f9f9; padding: 15px; border-left: 4px solid #007bff; margin: 10px 0; border-radius: 4px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 12px; font-size: 0.85em; color: white; font-weight: bold; margin-top: 10px; }
        .badge.en_attente { background: #f0ad4e; }
        .badge.accepte { background: #28a745; }
        .badge.refuse { background: #dc3545; }
        .btns { margin-top: 15px; display: flex; gap: 10px; }
        .btns button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; flex: 1; }
        .btn-accept { background: #28a745; }
        .btn-accept:hover { background: #218838; }
        .btn-refuse { background: #dc3545; }
        .btn-refuse:hover { background: #c82333; }
        .btns button:disabled { background: #ccc; cursor: not-allowed; }
        #login-box { max-width: 350px; margin: 120px auto; text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.15); }
        #login-box h2 { color: #333; margin-bottom: 20px; }
        #login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
        #login-box button { width: 100%; padding: 12px; background: #333; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 1em; transition: 0.3s; }
        #login-box button:hover { background: #555; }
        #login-error { color: red; margin-top: 10px; font-weight: bold; }
        .logout-btn { position: absolute; top: 20px; right: 20px; padding: 10px 18px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #demandes-container { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="login-box">
        <h2>🔐 Espace Prestataire</h2>
        <input type="password" id="password" placeholder="Mot de passe" onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()">Se connecter</button>
        <div id="login-error"></div>
    </div>

    <div id="demandes-container" style="display:none;">
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
        <h1>📋 Demandes de réservation en attente</h1>
        <div id="demandes-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>

    <script>
        // ===== INITIALISATION FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyB-pNaOwoA7cgKe3DM6Di0L_EBD3v_h2O4",
            authDomain: "sarmez-retreats.firebaseapp.com",
            projectId: "sarmez-retreats",
            storageBucket: "sarmez-retreats.firebasestorage.app",
            messagingSenderId: "586728433767",
            appId: "1:586728433767:web:567f3000153393b13c8cc2"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== INITIALISATION EMAILJS =====
        emailjs.init("7RJbubWGmgBgT2N5Y");

        // ===== LOGIN =====
        function login() {
            const password = document.getElementById("password").value;
            if (password === "0705") {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("demandes-container").style.display = "block";
                localStorage.setItem("logged", "true");
                loadDemandes();
            } else {
                document.getElementById("login-error").textContent = "❌ Mot de passe incorrect";
            }
        }

        function logout() {
            localStorage.removeItem("logged");
            location.reload();
        }

        // ===== CHARGER LES DEMANDES =====
        async function loadDemandes() {
            const demandesList = document.getElementById("demandes-list");
            demandesList.innerHTML = "<p>⏳ Chargement...</p>";

            try {
                const querySnapshot = await db.collection("demandes").where("statut", "==", "en_attente").get();

                if (querySnapshot.empty) {
                    demandesList.innerHTML = "<p style='text-align:center;'>✅ Aucune demande en attente</p>";
                    return;
                }

                demandesList.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;

                    const html = `
                        <div class="demande">
                            <p><strong>👤 Client:</strong> ${data.client_name || "N/A"}</p>
                            <p><strong>📧 Email:</strong> ${data.client_email || "N/A"}</p>
                            <p><strong>📱 Téléphone:</strong> ${data.client_phone || "N/A"}</p>

                            <div class="details">
                                <p><strong>🏡 Hébergement:</strong> ${data.bungalow || "Non spécifié"}</p>
                                <p><strong>📅 Dates:</strong> ${data.dates || "Non spécifié"}</p>
                                <p><strong>🌿 Pack:</strong> ${data.pack_choisi || "Non spécifié"}</p>
                                <p><strong>🛎️ Services:</strong> ${data.liste_services || "Aucun"}</p>
                                <p><strong>💰 Total:</strong> ${data.total_final || "0€"}</p>
                            </div>

                            <div class="btns">
                                <button class="btn-accept" onclick="handleDecision('${id}', 'accepte', '${(data.client_name || '').replace(/'/g, "\\'")}', '${data.client_email || ''}')">✅ Accepter</button>
                                <button class="btn-refuse" onclick="handleDecision('${id}', 'refuse', '${(data.client_name || '').replace(/'/g, "\\'")}', '${data.client_email || ''}')">❌ Refuser</button>
                            </div>
                        </div>
                    `;
                    demandesList.innerHTML += html;
                });

            } catch (error) {
                console.error("Erreur:", error);
                demandesList.innerHTML = "<p style='color:red;'>❌ Erreur lors du chargement</p>";
            }
        }

        // ===== ACCEPTER/REFUSER =====
        async function handleDecision(id, statut, clientName, clientEmail) {
            try {
                const docRef = db.collection("demandes").doc(id);
                const docSnap = await docRef.get();

                if (!docSnap.exists) {
                    alert("❌ Document non trouvé");
                    return;
                }

                const donnees = docSnap.data();

                // Mettre à jour le statut dans Firestore
                await docRef.update({ statut: statut });

                // Messages personnalisés
                const messageClient = statut === 'accepte' 
                    ? "✅ Votre demande a été acceptée ! Nous vous contacterons bientôt pour confirmer les détails."
                    : "❌ Malheureusement, votre demande n'a pas pu être acceptée cette fois-ci. N'hésitez pas à nous contacter pour explorer d'autres options.";

                // Paramètres pour EmailJS (mêmes noms que script.js)
                const templateParams = {
                    to_email: clientEmail,
                    client_name: clientName,
                    demande_id: id,
                    bungalow: donnees.bungalow || "Non spécifié",
                    dates: donnees.dates || "Non spécifié",
                    pack_choisi: donnees.pack_choisi || "Non spécifié",
                    liste_services: donnees.liste_services || "Aucun service",
                    total_final: donnees.total_final || "0€",
                    statut_emoji: statut === 'accepte' ? '✅' : '❌',
                    statut_text: statut === 'accepte' ? 'ACCEPTÉE' : 'REFUSÉE',
                    message_client: messageClient
                };

                console.log("📤 Envoi email avec:", templateParams);

                await emailjs.send("service_8chuqsf", "template_7m5glbl", templateParams);

                alert(statut === 'accepte' ? "✅ Demande acceptée et client notifié !" : "❌ Demande refusée et client notifié !");
                loadDemandes();

            } catch (error) {
                console.error("Erreur:", error);
                alert("❌ Erreur: " + error.message);
            }
        }

        // ===== VÉRIFIER LA SESSION =====
        if (localStorage.getItem("logged") === "true") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("demandes-container").style.display = "block";
            loadDemandes();
        }
    </script>

</body>
</html>
