<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Prestataire | Sarmèz Retreats</title>
    <link rel="stylesheet" href="calendar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.4rem; }
        h2 { color: #333; margin: 25px 0 12px; font-size: 1.15rem; }
        .demande { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .demande p { margin: 8px 0; line-height: 1.6; color: #555; }
        .demande strong { color: #333; }
        .details { background: #f9f9f9; padding: 15px; border-left: 4px solid #007bff; margin: 10px 0; border-radius: 4px; }
        .btns { margin-top: 15px; display: flex; gap: 10px; }
        .btns button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; flex: 1; }
        .btn-accept { background: #28a745; }
        .btn-refuse { background: #dc3545; }
        .btn-delete { background: #64748b; }
        #login-box { max-width: 350px; margin: 120px auto; text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.15); }
        #login-box h2 { margin-top: 0; }
        #login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
        #login-box button { width: 100%; padding: 12px; background: #333; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #login-error { color: red; margin-top: 10px; font-weight: bold; }
        .logout-btn { float: right; padding: 8px 14px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #demandes-container { max-width: 900px; margin: 0 auto; }
        #day-info .item { background: #f9f9f9; border-left: 4px solid #0284c7; padding: 10px 12px; margin-top: 8px; border-radius: 4px; font-size: .9rem; line-height: 1.5; }
        #day-info .item button { margin: 6px 6px 0 0; padding: 6px 12px; border: none; border-radius: 5px; color: #fff; cursor: pointer; font-weight: bold; }
        .block-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .block-form input, .block-form select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; width: 100%; }
        .block-form button { grid-column: 1 / -1; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .cal-wrap { margin-bottom: 0; }
    </style>
</head>
<body>
    <div id="login-box">
        <h2>🔐 Espace Prestataire</h2>
        <input type="email" id="email" placeholder="Email" autocomplete="username">
        <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()">Se connecter</button>
        <div id="login-error"></div>
    </div>

    <div id="demandes-container" style="display:none;">
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
        <h1>📅 Planning des bungalows</h1>

        <div class="cal-wrap">
            <div id="cal-root"></div>
            <div class="cal-legend">
                <span><i style="background:#d1fae5"></i>Libre</span>
                <span><i style="background:#fef3c7"></i>Demande (à traiter)</span>
                <span><i style="background:#fee2e2"></i>Accepté</span>
            </div>
            <p class="cal-hint">Cliquez sur un jour pour voir le détail.</p>
            <div id="day-info"></div>
        </div>

        <h2>🔒 Bloquer des dates (réservation directe, travaux…)</h2>
        <div class="block-form">
            <select id="b-bungalow">
                 <option>SR Plage</option><option>SR Rivière</option><option>SR Tradition</option><option>SR Mangrove</option>
            </select>
            <input type="text" id="b-label" placeholder="Libellé (ex : Réservation directe)">
            <input type="date" id="b-in">
            <input type="date" id="b-out">
            <button onclick="blockDates()">Bloquer ces dates</button>
        </div>

        <h2>📋 Demandes de réservation en attente</h2>
        <div id="demandes-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="calendar.js"></script>

    <script>
        const BUNGALOWS = ["SR Plage", "SR Rivière", "SR Tradition", "SR Mangrove"];
        firebase.initializeApp({
            apiKey: "AIzaSyB-pNaOwoA7cgKe3DM6Di0L_EBD3v_h2O4",
            authDomain: "sarmez-retreats.firebaseapp.com",
            projectId: "sarmez-retreats",
            storageBucket: "sarmez-retreats.firebasestorage.app",
            messagingSenderId: "586728433767",
            appId: "1:586728433767:web:567f3000153393b13c8cc2"
        });
        const db = firebase.firestore();
        emailjs.init("7RJbubWGmgBgT2N5Y");

        // ⚠️ Remplace par ton lien de paiement (PayPal.me, Stripe, SumUp, Lydia…)
        const LIEN_PAIEMENT = "https://paypal.me/VOTRE_NOM";
        function lienPaiement(d) {
            const montant = parseFloat(String(d.total_final || "").replace(/[^\d.,]/g, "").replace(",", "."));
            // Avec PayPal.me, le montant du séjour est ajouté automatiquement au lien
            if (LIEN_PAIEMENT.includes("paypal.me") && montant > 0) {
                return LIEN_PAIEMENT.replace(/\/$/, "") + "/" + montant + "EUR";
            }
            return LIEN_PAIEMENT;
        }

        let allDemandes = [];
        let cal = null;

        // ===== LOGIN =====
        function showApp() {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("demandes-container").style.display = "block";
            if (!cal) {
                cal = SarmezCalendar.create(document.getElementById("cal-root"), {
                    bungalows: BUNGALOWS, admin: true, onDayClick: showDay
                });
            }
            loadAll();
        }
        async function login() {
            try {
                await firebase.auth().signInWithEmailAndPassword(
                    document.getElementById("email").value.trim(),
                    document.getElementById("password").value
                );
            } catch (e) {
                document.getElementById("login-error").textContent = "❌ Email ou mot de passe incorrect";
            }
        }
        function logout() { firebase.auth().signOut().then(() => location.reload()); }
        // La session est gérée par Firebase : l'espace s'affiche seulement si connecté
        firebase.auth().onAuthStateChanged(user => { if (user) showApp(); });

        function esc(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        const fr = d => d ? d.split("-").reverse().join("/") : "";

        // ===== CHARGEMENT =====
        async function loadAll() {
            try {
                const snap = await db.collection("demandes").get();
                allDemandes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                document.getElementById("demandes-list").innerHTML = `<p style="color:red">❌ ${esc(e.message)}</p>`;
                return;
            }
            refreshCalendar();
            renderPending();
        }

        function refreshCalendar() {
            cal.setEvents(allDemandes
                .filter(d => d.date_in && d.date_out && (d.statut === "accepte" || d.statut === "en_attente"))
                .map(d => ({ id: d.id, bungalow: d.bungalow, date_in: d.date_in, date_out: d.date_out,
                             statut: d.statut, label: d.client_name || "?" })));
            // Pastille rouge : nombre de demandes en attente par bungalow
            const badges = {};
            allDemandes.filter(d => d.statut === "en_attente").forEach(d => {
                badges[d.bungalow] = (badges[d.bungalow] || 0) + 1;
            });
            cal.setBadges(badges);
            document.getElementById("day-info").innerHTML = "";
        }

        // ===== DÉTAIL D'UN JOUR =====
        function showDay(day, state, evs) {
            const box = document.getElementById("day-info");
            if (!evs.length) { box.innerHTML = `<div class="item">Le ${fr(day)} : libre ✅</div>`; return; }
            box.innerHTML = evs.map(e => {
                const d = allDemandes.find(x => x.id === e.id) || {};
                const acc = e.statut === "accepte";
                return `<div class="item">
                    <strong>${esc(d.client_name)}</strong> — ${esc(d.bungalow)} — ${acc ? "✅ Accepté" : "⏳ En attente"}<br>
                    ${fr(d.date_in)} → ${fr(d.date_out)}<br>
                    📧 ${esc(d.client_email)} · 📱 ${esc(d.client_phone)}<br>
                    <button style="background:#dc3545" data-cancel="${esc(e.id)}">${acc ? "Annuler la réservation" : "Refuser"}</button>
                    ${acc ? `<button style="background:#25D366" data-arrive="${esc(e.id)}">💬 Envoyer le guide d'arrivée</button>` : ""}
                    ${acc ? "" : `<button style="background:#28a745" data-accept="${esc(e.id)}">Accepter</button>`}
                    <button style="background:#64748b" data-delete="${esc(e.id)}">🗑 Supprimer</button>
                </div>`;
            }).join("");
            box.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => decide(b.dataset.cancel, "refuse", true));
            box.querySelectorAll("[data-accept]").forEach(b => b.onclick = () => decide(b.dataset.accept, "accepte", true));
            box.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => supprimer(b.dataset.delete));
            box.querySelectorAll("[data-arrive]").forEach(b => b.onclick = () => envoyerArrivee(b.dataset.arrive));
        }

        // ===== LISTE DES DEMANDES EN ATTENTE =====
        function renderPending() {
            const list = document.getElementById("demandes-list");
            const pending = allDemandes.filter(d => d.statut === "en_attente");
            if (!pending.length) { list.innerHTML = "<p style='text-align:center;'>✅ Aucune demande en attente</p>"; return; }
            list.innerHTML = pending.map(d => `
                <div class="demande">
                    <p><strong>👤 Client :</strong> ${esc(d.client_name) || "N/A"}</p>
                    <p><strong>📧 Email :</strong> ${esc(d.client_email) || "N/A"}</p>
                    <p><strong>📱 Téléphone :</strong> ${esc(d.client_phone) || "N/A"}</p>
                    <div class="details">
                        <p><strong>🏡 Hébergement :</strong> ${esc(d.bungalow) || "Non spécifié"}</p>
                        <p><strong>📅 Dates :</strong> ${esc(d.dates) || "Non spécifié"}</p>
                        <p><strong>👥 Voyageurs :</strong> ${esc(d.nb_voyageurs) || "Non précisé"}</p>
                        <p><strong>💬 Message :</strong> ${esc(d.message_demande) || "Aucun"}</p>
                        <p><strong>🌿 Pack :</strong> ${esc(d.pack_choisi) || "Non spécifié"}</p>
                        <p><strong>🛎️ Services :</strong> ${esc(d.liste_services) || "Aucun"}</p>
                        <p><strong>💰 Total :</strong> ${esc(d.total_final) || "0€"}</p>
                    </div>
                    <div class="btns">
                        <button class="btn-accept" data-id="${esc(d.id)}">✅ Accepter</button>
                        <button class="btn-refuse" data-id="${esc(d.id)}">❌ Refuser</button>
                        <button class="btn-delete" data-id="${esc(d.id)}">🗑 Supprimer</button>
                    </div>
                </div>`).join("");
            list.querySelectorAll(".btn-accept").forEach(b => b.onclick = () => decide(b.dataset.id, "accepte", true));
            list.querySelectorAll(".btn-refuse").forEach(b => b.onclick = () => decide(b.dataset.id, "refuse", true));
            list.querySelectorAll(".btn-delete").forEach(b => b.onclick = () => supprimer(b.dataset.id));
        }

        // ===== ACCEPTER / REFUSER / ANNULER =====
        async function decide(id, statut, notify) {
            const d = allDemandes.find(x => x.id === id);
            if (!d) return alert("❌ Demande introuvable");
            if (statut === "accepte" && d.date_in && d.date_out) {
                const conflict = allDemandes.some(x => x.id !== id && x.statut === "accepte" && x.bungalow === d.bungalow &&
                    x.date_in < d.date_out && x.date_out > d.date_in);
                if (conflict) return alert("❌ Ces dates chevauchent une réservation déjà acceptée.");
            }
            if (statut === "refuse" && !confirm("Confirmer ?")) return;

            // 1) Enregistrement du statut et du calendrier
            try {
                await db.collection("demandes").doc(id).update({ statut });
                if (d.date_in && d.date_out) {
                    const ref = db.collection("bloquages").doc(id);
                    if (statut === "accepte") await ref.set({ bungalow: d.bungalow, date_in: d.date_in, date_out: d.date_out, statut: "accepte" });
                    else await ref.delete();
                }
            } catch (e) {
                console.error(e);
                return alert("❌ Erreur enregistrement : " + (e.message || JSON.stringify(e)));
            }

            // 2) Email client (une erreur ici n'annule pas la décision)
            let emailMsg = "";
            if (notify && d.client_email && d.client_email !== "Non renseigné") {
                const lien = statut === "accepte" ? lienPaiement(d) : "";
                const msgOk = "✅ Votre demande a été acceptée ! Pour confirmer votre réservation, merci de régler votre séjour via ce lien de paiement : " + lien;
                const msgKo = "❌ Malheureusement, votre demande n'a pas pu être acceptée cette fois-ci. N'hésitez pas à nous contacter pour explorer d'autres options.";
                try {
                    await emailjs.send("service_8chuqsf", "template_7m5glbl", {
                        to_email: d.client_email,
                        client_email: d.client_email,
                        email: d.client_email,
                        client_name: d.client_name,
                        demande_id: id,
                        bungalow: d.bungalow || "Non spécifié",
                        dates: d.dates || "Non spécifié",
                        nb_voyageurs: "\u00a0" + (d.nb_voyageurs || "Non précisé"),
                        message_demande: "\u00a0" + (d.message_demande || "Aucun"),
                        pack_choisi: d.pack_choisi || "Non spécifié",
                        liste_services: d.liste_services || "Aucun service",
                        total_final: d.total_final || "0€",
                        lien_paiement: lien,
                        statut_emoji: statut === "accepte" ? "✅" : "❌",
                        statut_text: statut === "accepte" ? "ACCEPTÉE" : "REFUSÉE",
                        statut_sujet: statut === "accepte" ? "Votre demande est acceptée - Sarmèz Retreats" : "Votre demande a été refusée - Sarmèz Retreats",
                        statut_message: statut === "accepte" ? msgOk : msgKo,
                        message_client: statut === "accepte" ? msgOk : msgKo
                    });
                } catch (e) {
                    console.error(e);
                    emailMsg = "\n⚠️ Email non envoyé au client : " + (e.text || e.message || JSON.stringify(e));
                }
            }

            alert((statut === "accepte" ? "✅ Réservation acceptée." : "❌ Demande refusée.") + emailMsg);
            await loadAll();
        }

        // ===== SUPPRIMER (sans email au client) =====
        async function supprimer(id) {
            if (!confirm("Supprimer définitivement cette demande ? Le client ne sera pas prévenu.")) return;
            try {
                await db.collection("bloquages").doc(id).delete();
                await db.collection("demandes").doc(id).delete();
                await loadAll();
            } catch (e) { alert("❌ Erreur : " + e.message); }
        }

                // ===== GUIDE D'ARRIVÉE PAR WHATSAPP =====
        function numeroWhatsApp(tel) {
            let n = String(tel || "").replace(/[^\d+]/g, "");
            if (n.startsWith("00")) n = "+" + n.slice(2);
            if (n.startsWith("+")) {
                n = n.slice(1);
                if (n.startsWith("5900")) n = "590" + n.slice(4);
                return n;
            }
            if (n.startsWith("590")) return n;
            if (/^(690|691)\d{6}$/.test(n)) return "590" + n;
            if (/^0(690|691|590)\d{6}$/.test(n)) return "590" + n.slice(1);
            if (/^0\d{9}$/.test(n)) return "33" + n.slice(1);
            return n;
        }
        function envoyerArrivee(id) {
            const d = allDemandes.find(x => x.id === id);
            if (!d) return alert("Demande introuvable.");
            const num = numeroWhatsApp(d.client_phone);
            if (!num) return alert("Téléphone du client introuvable.");
            const code = prompt("Code de la boîte à clés pour ce séjour :");
            if (!code) return;
            const texte = `Bonjour ${d.client_name},\n\nVotre séjour à Sarmèz Retreats approche ! Voici les informations pour votre arrivée :\n\n🏡 ${d.bungalow}\n📅 ${d.dates}\n📍 Localisation exacte du bungalow :\nhttps://www.google.com/maps?q=16.3871163,-61.4614942\n🔑 Code de la boîte à clés : ${code}\n\nTout le détail (accès, wifi, piscine, départ) est ici :\nhttps://sarmez-retreats.pages.dev/guide-accueil.html\n\nÀ très bientôt,\nWill - Sarmèz Retreats`;
            window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(texte), "_blank");
        }
        // ===== BLOCAGE MANUEL =====
        async function blockDates() {
            const bungalow = document.getElementById("b-bungalow").value;
            const din = document.getElementById("b-in").value;
            const dout = document.getElementById("b-out").value;
            const label = document.getElementById("b-label").value.trim() || "Réservation directe";
            if (!din || !dout || dout <= din) return alert("Dates invalides.");
            if (SarmezCalendar.overlaps(allDemandes.filter(x => x.date_in), bungalow, din, dout)) {
                return alert("Ces dates chevauchent une réservation déjà acceptée.");
            }
            try {
                const ref = await db.collection("demandes").add({
                    client_name: label, bungalow, date_in: din, date_out: dout,
                    dates: `Du ${fr(din)} au ${fr(dout)}`, statut: "accepte", source: "manuel",
                    date_creation: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection("bloquages").doc(ref.id).set({ bungalow, date_in: din, date_out: dout, statut: "accepte" });
                document.getElementById("b-in").value = ""; document.getElementById("b-out").value = "";
                await loadAll();
            } catch (e) { alert("❌ Erreur : " + e.message); }
        }
    </script>
</body>
</html>
